<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Rastreamento - Cheguei Delivery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/restaurante.css">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    #mapaRastreamento {
      width: 100%;
      height: 440px;
      border-radius: 18px;
      border: 1px solid #e6e8ee;
      overflow: hidden;
      margin-top: 14px;
    }

    .tracking-list {
      margin-top: 16px;
      display: grid;
      gap: 12px;
    }

    .tracking-item {
      padding: 16px;
      border: 1px solid #e6e8ee;
      border-radius: 18px;
      background: #fbfcfd;
    }

    .tracking-item strong {
      display: block;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .tracking-item p {
      margin: 5px 0;
      color: #5d6472;
      line-height: 1.35;
    }

    .tracking-status {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      background: #dbeafe;
      color: #1d4ed8;
    }
  </style>
</head>

<body>
  <main class="restaurant-app">
    <header class="restaurant-header">
      <div>
        <span>Cheguei Restaurantes</span>
        <h1>Rastreamento</h1>
      </div>

      <a class="back-link" href="./dashboard.html">Voltar</a>
    </header>

    <section class="wallet-card">
      <span>Entregas em tempo real</span>
      <strong id="totalCorridas">Carregando...</strong>
      <p>Acompanhe no mapa somente as corridas aceitas e ainda não finalizadas.</p>
    </section>

    <section class="info-card history-card">
      <span>Mapa</span>
      <strong>Localização do motoboy</strong>

      <div id="mapaRastreamento"></div>

      <div id="listaRastreamento" class="tracking-list">
        <div class="empty-mini">Carregando entregas em andamento...</div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import {
      iniciarRastreamentoRestaurante
    } from "../js/restaurante-rastreamento.js?v=3";

    iniciarRastreamentoRestaurante();
  </script>
</body>
</html>
